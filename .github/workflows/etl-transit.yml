name: ETL - Transit Congestion

on:
  schedule:
    # Every 5 minutes. 3 GTFS-R calls per run (train/tram/bus),
    # well under Transport Victoria's 24 calls/60s per-mode limit.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: etl-transit-congestion
  cancel-in-progress: false

jobs:
  sync-transit-congestion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      TV_API_KEY: ${{ secrets.TV_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - run: python -m etl.sync_transit_congestion
